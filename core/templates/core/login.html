<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Aqua Lancha</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#0369a1,#0ea5e9);min-height:100vh;display:flex;align-items:center;justify-content:center}
.box{background:#fff;border-radius:20px;padding:2.5rem;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.logo{text-align:center;margin-bottom:1.5rem}
.logo span{font-size:3rem}
h2{font-size:1.5rem;font-weight:700;color:#0369a1;text-align:center;margin-bottom:.3rem}
.sub{text-align:center;color:#6b7280;font-size:.9rem;margin-bottom:1.8rem}
.form-group{margin-bottom:1.1rem}
label{display:block;font-size:.88rem;font-weight:500;color:#374151;margin-bottom:.35rem}
input{width:100%;padding:.7rem 1rem;border:1.5px solid #d1d5db;border-radius:10px;font-size:.95rem;transition:.2s}
input:focus{outline:none;border-color:#0ea5e9;box-shadow:0 0 0 3px rgba(14,165,233,.15)}
.btn{width:100%;padding:.8rem;background:linear-gradient(135deg,#0369a1,#0ea5e9);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;margin-top:.5rem;transition:.2s}
.btn:hover{opacity:.9}
.links{text-align:center;margin-top:1.2rem;font-size:.88rem;color:#6b7280}
.links a{color:#0ea5e9;font-weight:500}
.alert{background:#fee2e2;color:#991b1b;padding:.7rem 1rem;border-radius:8px;margin-bottom:1rem;font-size:.88rem}
.hint{background:#e0f2fe;color:#075985;padding:.7rem 1rem;border-radius:8px;margin-bottom:1rem;font-size:.82rem}
</style>
</head>
<body>
<div class="box">
  <div class="logo"><span>⛵</span></div>
  <h2>Aqua Lancha</h2>
  <p class="sub">Acesse sua conta</p>
  {% for msg in messages %}<div class="alert">{{ msg }}</div>{% endfor %}
  
  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label>Usuário</label>
      <input type="text" name="username" placeholder="Digite seu usuário" required autofocus>
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" name="password" placeholder="Digite sua senha" required>
    </div>
    <button type="submit" class="btn">Entrar →</button>
  </form>
  <div class="links">Não tem conta? <a href="{% url 'registro' %}">Cadastre-se</a></div>
</div>
</body>
</html>
