<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aqua Lancha - Sistema de Lanchas</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#0369a1 0%,#0ea5e9 50%,#38bdf8 100%);min-height:100vh;display:flex;align-items:center;justify-content:center}
.hero{text-align:center;color:#fff;padding:2rem}
.logo{font-size:5rem;margin-bottom:1rem}
h1{font-size:3rem;font-weight:800;margin-bottom:.5rem}
p{font-size:1.2rem;opacity:.9;margin-bottom:2.5rem}
.btns{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.btn{padding:.9rem 2rem;border-radius:12px;font-size:1rem;font-weight:600;text-decoration:none;transition:.2s}
.btn-white{background:#fff;color:#0369a1}.btn-white:hover{background:#e0f2fe}
.btn-outline{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.6)}.btn-outline:hover{background:rgba(255,255,255,.15)}
.waves{position:fixed;bottom:0;width:100%;opacity:.3}
</style>
</head>
<body>
<div class="hero">
  <div class="logo">⛵</div>
  <h1>Aqua Lancha</h1>
  <p>Sistema de Reservas de Lanchas</p>
  <div class="btns">
    <a href="{% url 'login' %}" class="btn btn-white">🔐 Entrar</a>
    <a href="{% url 'registro' %}" class="btn btn-outline">📝 Criar Conta</a>
  </div>
</div>
</body>
</html>
