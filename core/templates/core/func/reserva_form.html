{% extends 'core/base.html' %}
{% block title %}Nova Reserva - Funcionario{% endblock %}
{% block content %}
<div class="page-header">
  <h1>➕ Nova Reserva (por Telefone)</h1>
  <a href="{% url 'func_dashboard' %}" class="btn btn-secondary">← Voltar</a>
</div>
<div class="card" style="max-width:640px">
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
    <div class="form-group">
      <label>{{ field.label }}</label>
      {{ field }}
      {% for e in field.errors %}<div style="color:#ef4444;font-size:.8rem">{{ e }}</div>{% endfor %}
    </div>
    {% endfor %}
    <div style="display:flex;gap:.8rem;margin-top:.5rem">
      <button type="submit" class="btn btn-primary">💾 Confirmar Reserva</button>
      <a href="{% url 'func_dashboard' %}" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
