{% extends 'core/base.html' %}
{% block title %}Cadastrar Cliente{% endblock %}
{% block content %}
<div class="page-header">
  <h1>👤 Cadastrar Cliente</h1>
  <a href="{% url 'func_dashboard' %}" class="btn btn-secondary">← Voltar</a>
</div>
<div class="card" style="max-width:600px">
  <form method="post">
    {% csrf_token %}
    <div class="form-grid">
    {% for field in form %}
    <div class="form-group {% if field.name == 'username' or field.name == 'email' %}full{% endif %}" style="{% if field.name == 'username' or field.name == 'email' %}grid-column:1/-1{% endif %}">
      <label>{{ field.label }}</label>
      {{ field }}
      {% for e in field.errors %}<div style="color:#ef4444;font-size:.8rem">{{ e }}</div>{% endfor %}
    </div>
    {% endfor %}
    </div>
    <button type="submit" class="btn btn-primary" style="margin-top:.5rem">Cadastrar Cliente</button>
  </form>
</div>
{% endblock %}
